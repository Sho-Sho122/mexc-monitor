name: MEXC Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run MEXC scanner
        run: python mexc_scanner.py

      - name: Run signal system
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TZ: Asia/Tokyo
        run: python mexc_system.py

      - name: Save system state
        run: |
          git config user.name "mexc-monitor-bot"
          git config user.email "mexc-monitor-bot@users.noreply.github.com"
          git add mexc_system_state.json mexc_paper_trades.csv 2>/dev/null || true
          git add signal_*.txt 2>/dev/null || true
          git commit -m "Update MEXC monitor state" || exit 0
          git push
