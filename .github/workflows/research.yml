name: MEXC Research

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mexc-research
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run research scanner
        env:
          TZ: Asia/Tokyo
        run: python mexc_scanner_research.py

      - name: Run HIGH EDGE strategy
        env:
          TZ: Asia/Tokyo
        run: python strategy_high_edge.py

      - name: Run TREND VOLUME strategy
        env:
          TZ: Asia/Tokyo
        run: python strategy_trend_volume.py

      - name: Run PULLBACK strategy
        env:
          TZ: Asia/Tokyo
        run: python strategy_pullback.py

      - name: Run OI FUNDING strategy
        env:
          TZ: Asia/Tokyo
        run: python strategy_oi_funding.py

      - name: Save research state robustly
        shell: bash
        run: |
          set -e

          git config user.name "mexc-research-bot"
          git config user.email "mexc-research-bot@users.noreply.github.com"

          mkdir -p /tmp/mexc-research-save

          for file in             strategy_high_edge_state.json             strategy_high_edge.csv             strategy_trend_volume_state.json             strategy_trend_volume.csv             strategy_pullback_state.json             strategy_pullback.csv             strategy_oi_funding_state.json             strategy_oi_funding.csv             mexc_oi_state_research.json
          do
            if [ -f "$file" ]; then
              cp "$file" "/tmp/mexc-research-save/$file"
            fi
          done

          for attempt in 1 2 3 4 5
          do
            echo "Save attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            for file in /tmp/mexc-research-save/*
            do
              [ -e "$file" ] || continue
              cp "$file" .
              git add "$(basename "$file")"
            done

            if git diff --cached --quiet; then
              echo "No research state changes"
              exit 0
            fi

            git commit -m "Update MEXC research state"

            if git push origin HEAD:main; then
              echo "Research state saved"
              exit 0
            fi

            echo "Push raced with another workflow. Retrying..."
            sleep 3
          done

          echo "Could not save research state after 5 attempts"
          exit 1
