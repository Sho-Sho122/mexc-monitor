name: MEXC Research

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mexc-research
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      PERSISTENCE_BACKUP: /tmp/research-persistence-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Refresh formal state before computation
        id: prepare_state
        run: python research_persistence.py prepare --backup "$PERSISTENCE_BACKUP"

      - name: Record research run start
        id: research_start
        shell: bash
        run: echo "time=$(date --iso-8601=seconds)" >> "$GITHUB_OUTPUT"

      - name: Run research scanner
        env:
          TZ: Asia/Tokyo
        run: python mexc_scanner_research.py

      - name: Run HIGH EDGE strategy
        env:
          TZ: Asia/Tokyo
        run: python strategy_high_edge.py

      - name: Run TREND VOLUME strategy
        env:
          TZ: Asia/Tokyo
        run: python strategy_trend_volume.py

      - name: Run PULLBACK strategy
        env:
          TZ: Asia/Tokyo
        run: python strategy_pullback.py

      - name: Run OI FUNDING strategy
        id: oi_strategy
        env:
          TZ: Asia/Tokyo
        run: python strategy_oi_funding.py

      - name: Run 511 beta1 shadow
        id: model511
        continue-on-error: true
        env:
          TZ: Asia/Tokyo
        run: >-
          python -m model511 --mode FORWARD
          --verify-strategy-states
          --run-start "${{ steps.research_start.outputs.time }}"
          --fetch-market

      - name: Run EXIT Research
        env:
          TZ: Asia/Tokyo
        run: python research_exit.py

      - name: Archive research independently
        id: archive_research
        if: ${{ always() && steps.oi_strategy.outcome == 'success' }}
        continue-on-error: true
        run: python research_persistence.py archive --group research --backup "$PERSISTENCE_BACKUP"

      - name: Archive 511 independently
        id: archive511
        if: ${{ always() && steps.oi_strategy.outcome == 'success' }}
        continue-on-error: true
        run: python research_persistence.py archive --group 511 --backup "$PERSISTENCE_BACKUP"

      - name: Preserve 511 recovery evidence before research save
        id: recovery511
        if: ${{ always() && steps.oi_strategy.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: model511-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            511_data
            ${{ env.PERSISTENCE_BACKUP }}/511
            ${{ env.PERSISTENCE_BACKUP }}/baseline.json
          if-no-files-found: error

      - name: Preserve research recovery evidence before save
        id: recovery_research
        if: ${{ always() && steps.oi_strategy.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: research-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PERSISTENCE_BACKUP }}/research
            ${{ env.PERSISTENCE_BACKUP }}/baseline.json
            strategy_high_edge.csv
            strategy_high_edge_state.json
            strategy_trend_volume.csv
            strategy_trend_volume_state.json
            strategy_pullback.csv
            strategy_pullback_state.json
            strategy_oi_funding.csv
            strategy_oi_funding_state.json
            mexc_oi_state_research.json
            research_exit_state.json
            research_exit_trades*.csv
            research_exit_results*.csv
          if-no-files-found: error

      - name: Save research state robustly
        id: research_save
        if: ${{ always() && steps.oi_strategy.outcome == 'success' && steps.archive_research.outcome == 'success' }}
        continue-on-error: true
        run: python research_persistence.py save --group research --backup "$PERSISTENCE_BACKUP"

      - name: Save 511 independently
        id: save511
        if: ${{ always() && steps.model511.outcome == 'success' && steps.research_save.outcome == 'success' && steps.archive511.outcome == 'success' }}
        continue-on-error: true
        run: python research_persistence.py save --group 511 --backup "$PERSISTENCE_BACKUP"

      - name: Preserve 511 save audit
        id: audit511
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: model511-save-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            511_data
            ${{ env.PERSISTENCE_BACKUP }}/511
            ${{ env.PERSISTENCE_BACKUP }}/baseline.json
            ${{ env.PERSISTENCE_BACKUP }}/save_audit.jsonl
          if-no-files-found: warn

      - name: Preserve research save audit
        id: audit_research
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: research-save-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PERSISTENCE_BACKUP }}/research
            ${{ env.PERSISTENCE_BACKUP }}/baseline.json
            ${{ env.PERSISTENCE_BACKUP }}/save_audit.jsonl
            strategy_high_edge.csv
            strategy_high_edge_state.json
            strategy_trend_volume.csv
            strategy_trend_volume_state.json
            strategy_pullback.csv
            strategy_pullback_state.json
            strategy_oi_funding.csv
            strategy_oi_funding_state.json
            mexc_oi_state_research.json
            research_exit_state.json
            research_exit_trades*.csv
            research_exit_results*.csv
          if-no-files-found: warn

      - name: Report persistence or 511 failure
        if: >-
          ${{ always() && (steps.prepare_state.outcome == 'failure' ||
          steps.model511.outcome == 'failure' || steps.archive511.outcome == 'failure' ||
          steps.recovery511.outcome == 'failure' || steps.save511.outcome == 'failure' ||
          steps.archive_research.outcome == 'failure' || steps.research_save.outcome == 'failure' ||
          steps.recovery_research.outcome == 'failure' || steps.audit511.outcome == 'failure' ||
          steps.audit_research.outcome == 'failure') }}
        run: exit 1
