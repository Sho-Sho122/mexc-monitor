name: MEXC Research

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mexc-research
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run research scanner
        env:
          TZ: Asia/Tokyo
        run: python mexc_scanner_research.py

      - name: Run HIGH EDGE strategy
        env:
          TZ: Asia/Tokyo
        run: python strategy_high_edge.py

      - name: Save research state
        run: |
          git config user.name "mexc-research-bot"
          git config user.email "mexc-research-bot@users.noreply.github.com"

          for file in strategy_high_edge_state.json strategy_high_edge.csv mexc_oi_state_research.json
          do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "No research state changes"
            exit 0
          fi

          git commit -m "Update MEXC research state"
          git pull --rebase origin main
          git push origin main
