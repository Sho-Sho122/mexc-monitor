name: MEXC Research

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mexc-research
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Record research run start
        id: research_start
        shell: bash
        run: echo "time=$(date --iso-8601=seconds)" >> "$GITHUB_OUTPUT"

      - name: Run research scanner
        env:
          TZ: Asia/Tokyo
        run: python mexc_scanner_research.py

      - name: Run HIGH EDGE strategy
        env:
          TZ: Asia/Tokyo
        run: python strategy_high_edge.py

      - name: Run TREND VOLUME strategy
        env:
          TZ: Asia/Tokyo
        run: python strategy_trend_volume.py

      - name: Run PULLBACK strategy
        env:
          TZ: Asia/Tokyo
        run: python strategy_pullback.py

      - name: Run OI FUNDING strategy
        id: oi_strategy
        env:
          TZ: Asia/Tokyo
        run: python strategy_oi_funding.py

      - name: Run 511 beta1 shadow
        id: model511
        continue-on-error: true
        env:
          TZ: Asia/Tokyo
        run: >-
          python -m model511 --mode FORWARD
          --verify-strategy-states
          --run-start "${{ steps.research_start.outputs.time }}"
          --fetch-market

      - name: Run EXIT Research
        env:
          TZ: Asia/Tokyo
        run: python research_exit.py

      - name: Archive 511 independently
        id: archive511
        if: ${{ always() && steps.oi_strategy.outcome == 'success' }}
        continue-on-error: true
        run: python -m model511.workflow_save archive --backup /tmp/model511-recovery

      - name: Preserve 511 recovery evidence before research save
        id: recovery511
        if: ${{ always() && steps.oi_strategy.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: model511-recovery-${{ github.run_id }}
          path: |
            511_data
            /tmp/model511-recovery
          if-no-files-found: warn

      - name: Save research state robustly
        id: research_save
        if: ${{ always() && steps.oi_strategy.outcome == 'success' }}
        shell: bash
        run: |

          set -e

          git config user.name "mexc-research-bot"
          git config user.email "mexc-research-bot@users.noreply.github.com"

          mkdir -p /tmp/mexc-research-save

          for file in \
            strategy_high_edge_state.json \
            strategy_high_edge.csv \
            strategy_trend_volume_state.json \
            strategy_trend_volume.csv \
            strategy_pullback_state.json \
            strategy_pullback.csv \
            strategy_oi_funding_state.json \
            strategy_oi_funding.csv \
            mexc_oi_state_research.json \
            research_exit_state.json \
            research_exit_trades.csv \
            research_exit_results.csv
          do
            if [ -f "$file" ]; then
              cp "$file" "/tmp/mexc-research-save/$file"
            fi
          done

          for file in research_exit_trades_*.csv research_exit_results_*.csv
          do
            if [ -f "$file" ]; then
              cp "$file" "/tmp/mexc-research-save/$file"
            fi
          done

          for attempt in 1 2 3 4 5
          do
            echo "Save attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            for file in /tmp/mexc-research-save/*
            do
              [ -e "$file" ] || continue
              cp "$file" .
              git add "$(basename "$file")"
            done

            if git diff --cached --quiet; then
              echo "No research state changes"
              exit 0
            fi

            git commit -m "Update MEXC research state"

            if git push origin HEAD:main; then
              echo "Research state saved"
              exit 0
            fi

            echo "Push raced with another workflow. Retrying..."
            sleep 3
          done

          echo "Could not save research state after 5 attempts"
          exit 1

      - name: Save 511 independently
        id: save511
        if: ${{ always() && steps.research_save.outcome == 'success' && steps.archive511.outcome == 'success' }}
        continue-on-error: true
        run: python -m model511.workflow_save save --backup /tmp/model511-recovery

      - name: Preserve 511 save audit
        if: ${{ always() && steps.oi_strategy.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: model511-save-audit-${{ github.run_id }}
          path: /tmp/model511-recovery
          if-no-files-found: warn

      - name: Report 511 failure
        if: ${{ always() && (steps.model511.outcome == 'failure' || steps.archive511.outcome == 'failure' || steps.recovery511.outcome == 'failure' || steps.save511.outcome == 'failure') }}
        run: exit 1
