name: MEXC Hybrid

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mexc-hybrid
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run MEXC scanner
        run: python mexc_scanner.py

      - name: Run HYBRID system
        env:
          DISCORD_HYBRID_WEBHOOK_URL: ${{ secrets.DISCORD_HYBRID_WEBHOOK_URL }}
          TZ: Asia/Tokyo
        run: python mexc_hybrid_system.py

      - name: Save HYBRID state
        run: |
          git config user.name "mexc-hybrid-bot"
          git config user.email "mexc-hybrid-bot@users.noreply.github.com"

          for file in mexc_hybrid_state.json mexc_hybrid_trades.csv
          do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "No HYBRID state changes"
            exit 0
          fi

          git commit -m "Update MEXC HYBRID state"

          git stash --include-untracked
          git pull --rebase origin main
          git stash pop || true

          git push origin main
