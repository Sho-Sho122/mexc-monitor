name: MEXC Hybrid

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: mexc-hybrid
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      HYBRID_BACKUP: ${{ github.workspace }}/../hybrid-persistence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Refresh and validate HYBRID inputs
        run: python hybrid_persistence.py prepare --backup "$HYBRID_BACKUP"
      - name: Run MEXC scanner
        run: python mexc_scanner.py
      - name: Checkpoint exact inputs
        run: python hybrid_persistence.py checkpoint --backup "$HYBRID_BACKUP"
      - name: Preserve inputs before computation
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.HYBRID_BACKUP }}/baseline.json
            ${{ env.HYBRID_BACKUP }}/input-checkpoint.json
          if-no-files-found: error
          retention-days: 90
      - name: Run HYBRID system
        env:
          DISCORD_HYBRID_WEBHOOK_URL: ${{ secrets.DISCORD_HYBRID_WEBHOOK_URL }}
          TZ: Asia/Tokyo
        run: python hybrid_persistence.py execute --backup "$HYBRID_BACKUP"
      - name: Seal completed output
        run: python hybrid_persistence.py archive --backup "$HYBRID_BACKUP"
      - name: Preserve output before saving
        id: recovery
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.HYBRID_BACKUP }}/recovery.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify durable Recovery by downloading it
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECOVERY_ID: ${{ steps.recovery.outputs.artifact-id }}
          RECOVERY_DIGEST: ${{ steps.recovery.outputs.artifact-digest }}
        run: python hybrid_persistence.py confirm --backup "$HYBRID_BACKUP" --artifact-id "$RECOVERY_ID" --digest "$RECOVERY_DIGEST"
      - name: Save HYBRID with compare-and-swap
        run: python hybrid_persistence.py save --backup "$HYBRID_BACKUP"
      - name: Preserve audit and diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.HYBRID_BACKUP }}
            mexc_hybrid_state.json
            mexc_hybrid_trades.csv
            mexc_scan_*.csv
          if-no-files-found: error
          retention-days: 90
